<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>よんたくん データ移行テスト</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.7;
    }

    h1 {
      font-size: 24px;
    }

    .box {
      background: #f5f5f5;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
    }

    button {
      font-size: 18px;
      padding: 12px 24px;
      margin: 8px 0;
      cursor: pointer;
    }

    #result {
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>よんたくん データ移行テスト</h1>

  <div class="box">
    <p>
      今回は「english-study-app-v1」だけをテストします。
    </p>

    <p id="status">確認中...</p>
  </div>

  <button id="createButton">
    テストデータを作成
  </button>

  <br>

  <button id="migrationButton" disabled>
    移行テスト
  </button>

  <div class="box">
    <h2>確認結果</h2>
    <div id="result"></div>
  </div>

  <script>
    const STORAGE_KEY = "english-study-app-v1";

    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const createButton = document.getElementById("createButton");
    const migrationButton = document.getElementById("migrationButton");


    // Chrome側のlocalStorageを確認する
    function checkData() {

      const data = localStorage.getItem(STORAGE_KEY);

      if (data) {

        status.textContent = "データが見つかりました。";

        result.textContent =
          "キー：\n" +
          STORAGE_KEY +
          "\n\n" +
          "データサイズ：" +
          data.length +
          " 文字\n\n" +
          "移行テストを実行できます。";

        migrationButton.disabled = false;

      } else {

        status.textContent = "データが見つかりません。";

        result.textContent =
          "localStorage に " +
          STORAGE_KEY +
          " がありません。";

        migrationButton.disabled = true;
      }
    }


    // テストデータを作成する
    createButton.addEventListener("click", function () {

      const testData = {
        test: "移行テスト用データ",
        message: "ChromeからAndroidへ移行するテストです"
      };

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(testData)
      );

      checkData();

      alert("テストデータを作成しました。");
    });


    // 「移行テスト」ボタン
    migrationButton.addEventListener("click", function () {

      const currentData = localStorage.getItem(STORAGE_KEY);

      if (!currentData) {
        alert("移行するデータがありません。");
        return;
      }

      // Androidへ渡すためにURLエンコードする
      const encodedData = encodeURIComponent(currentData);

      // Androidへデータを渡す
      const migrationUrl =
        "yontakun://migration?data=" + encodedData;

      result.textContent =
        "Androidアプリへデータを送信します。\n\n" +
        "データサイズ：" +
        currentData.length +
        " 文字";

      window.location.href = migrationUrl;
    });


    // ページを開いたときの確認
    checkData();

  </script>

</body>
</html>
