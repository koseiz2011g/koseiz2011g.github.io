<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>よんたくん データ移行テスト</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.7;
    }

    h1 {
      font-size: 24px;
    }

    .box {
      background: #f5f5f5;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
    }

    button {
      font-size: 18px;
      padding: 12px 24px;
      margin: 8px 0;
      cursor: pointer;
    }

    #result {
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>よんたくん データ移行テスト</h1>

  <div class="box">
    <p>
      Chromeに保存されている実際のよんたくんのデータを確認します。
    </p>

    <p>
      ※このページはデータを変更しません。
    </p>

    <p id="status">確認中...</p>
  </div>

  <button id="migrationButton" disabled>
    実データを移行テスト
  </button>

  <div class="box">
    <h2>確認結果</h2>
    <div id="result"></div>
  </div>

  <script>

    // 移行対象のlocalStorageキー
    const STORAGE_KEYS = [
      "english-study-app-v1",
      "weakQuestions",
      "stars",
      "records",
      "todayRecord",
      "soundVolume"
    ];


    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const migrationButton =
      document.getElementById("migrationButton");


    // Chrome側の実データを確認する
    function checkData() {

      let foundCount = 0;
      let resultText = "";

      STORAGE_KEYS.forEach(function(key) {

        const data = localStorage.getItem(key);

        if (data !== null) {

          foundCount++;

          resultText +=
            "【" + key + "】\n" +
            "データあり：" +
            data.length +
            "文字\n\n";

        } else {

          resultText +=
            "【" + key + "】\n" +
            "データなし\n\n";
        }
      });


      status.textContent =
        foundCount +
        "種類の実データが見つかりました。";

      result.textContent =
        resultText +
        "--------------------\n" +
        "Chrome側の確認が完了しました。";


      if (foundCount > 0) {
        migrationButton.disabled = false;
      } else {
        migrationButton.disabled = true;
      }
    }


    // 実際のChromeデータをAndroidへ送る
    migrationButton.addEventListener("click", function() {

      const migrationData = {};

      STORAGE_KEYS.forEach(function(key) {

        const data = localStorage.getItem(key);

        if (data !== null) {
          migrationData[key] = data;
        }

      });


      const jsonData =
        JSON.stringify(migrationData);

      const encodedData =
        encodeURIComponent(jsonData);


      const migrationUrl =
        "yontakun://migration?data=" +
        encodedData;


      result.textContent =
        "実際のよんたくんデータを送信します。\n\n" +
        "移行対象：" +
        Object.keys(migrationData).length +
        "種類\n\n" +
        "データサイズ：" +
        jsonData.length +
        "文字";


      window.location.href =
        migrationUrl;
    });


    // ページを開いたときに確認
    checkData();

  </script>

</body>
</html>
