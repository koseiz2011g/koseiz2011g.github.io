<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>よんたくん データ移行テスト</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.7;
    }

    h1 {
      font-size: 24px;
    }

    .box {
      background: #f5f5f5;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
    }

    button {
      font-size: 18px;
      padding: 12px 24px;
      margin: 8px 0;
      cursor: pointer;
    }

    #result {
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>よんたくん データ移行テスト</h1>

  <div class="box">
    <p>
      今回は6種類のlocalStorageデータをまとめてテストします。
    </p>

    <p id="status">確認中...</p>
  </div>

  <button id="createButton">
    テストデータを作成
  </button>

  <br>

  <button id="migrationButton" disabled>
    移行テスト
  </button>

  <div class="box">
    <h2>確認結果</h2>
    <div id="result"></div>
  </div>

  <script>

    // 移行対象のlocalStorageキー
    const STORAGE_KEYS = [
      "english-study-app-v1",
      "weakQuestions",
      "stars",
      "records",
      "todayRecord",
      "soundVolume"
    ];


    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const createButton = document.getElementById("createButton");
    const migrationButton = document.getElementById("migrationButton");


    // Chrome側のlocalStorageを確認する
    function checkData() {

      let foundCount = 0;
      let resultText = "";

      STORAGE_KEYS.forEach(function(key) {

        const data = localStorage.getItem(key);

        if (data !== null) {

          foundCount++;

          resultText +=
            "【" + key + "】\n" +
            "データあり：" +
            data.length +
            "文字\n\n";

        } else {

          resultText +=
            "【" + key + "】\n" +
            "データなし\n\n";
        }
      });


      if (foundCount > 0) {

        status.textContent =
          foundCount +
          "種類のデータが見つかりました。";

        result.textContent =
          resultText +
          "--------------------\n" +
          "移行テストを実行できます。";

        migrationButton.disabled = false;

      } else {

        status.textContent =
          "移行対象のデータがありません。";

        result.textContent =
          resultText;

        migrationButton.disabled = true;
      }
    }


    // テストデータを作成する
    createButton.addEventListener("click", function() {

      // ① english-study-app-v1
      const studyData = {
        test: "移行テスト用データ",
        message: "ChromeからAndroidへ移行するテストです"
      };

      localStorage.setItem(
        "english-study-app-v1",
        JSON.stringify(studyData)
      );


      // ② weakQuestions
      const weakQuestionsData = [
        {
          test: "弱点問題テスト"
        }
      ];

      localStorage.setItem(
        "weakQuestions",
        JSON.stringify(weakQuestionsData)
      );


      // ③ stars
      const starsData = {
        basic: 3,
        standard: 2
      };

      localStorage.setItem(
        "stars",
        JSON.stringify(starsData)
      );


      // ④ records
      const recordsData = {
        test: "連チャン記録テスト",
        maxChain: 9
      };

      localStorage.setItem(
        "records",
        JSON.stringify(recordsData)
      );


      // ⑤ todayRecord
      const todayRecordData = {
        test: "今日の記録テスト",
        challenge: 5
      };

      localStorage.setItem(
        "todayRecord",
        JSON.stringify(todayRecordData)
      );


      // ⑥ soundVolume
      localStorage.setItem(
        "soundVolume",
        "0.7"
      );


      checkData();

      alert("6種類のテストデータを作成しました。");
    });


    // 「移行テスト」ボタン
    migrationButton.addEventListener("click", function() {

      // 6種類のデータを1つにまとめる
      const migrationData = {};


      STORAGE_KEYS.forEach(function(key) {

        const data = localStorage.getItem(key);

        if (data !== null) {
          migrationData[key] = data;
        }

      });


      // JSON文字列にする
      const jsonData =
        JSON.stringify(migrationData);


      // Androidへ渡すためにURLエンコードする
      const encodedData =
        encodeURIComponent(jsonData);


      // Androidへデータを渡す
      const migrationUrl =
        "yontakun://migration?data=" +
        encodedData;


      result.textContent =
        "Androidアプリへデータを送信します。\n\n" +
        "移行対象：" +
        Object.keys(migrationData).length +
        "種類\n\n" +
        "データサイズ：" +
        jsonData.length +
        "文字";


      window.location.href =
        migrationUrl;
    });


    // ページを開いたときの確認
    checkData();

  </script>

</body>
</html>
