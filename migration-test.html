<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>よんたくん データ引き継ぎ</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.7;
    }

    h1 {
      font-size: 24px;
    }

    .box {
      background: #f5f5f5;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
    }

    button {
      display: block;
      width: 100%;
      font-size: 18px;
      padding: 14px 20px;
      margin: 12px 0;
      cursor: pointer;
    }

    #status {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>よんたくん データ引き継ぎ</h1>

  <div class="box">

    <p>
      今回のバージョンアップで、
      よんたくんのデータの保存場所が変わりました。
    </p>

    <p>
      これまでのよんたくんを利用していて、
      学習記録や連チャン記録などのデータがある場合は、
      「以前のデータを引き継ぐ」を押してください。
    </p>

    <p>
      以前のデータがない場合は、
      「新しく始める」を押してください。
    </p>

    <p>
      ※データを引き継ぐ場合、これまでのよんたくんのデータを
      新しい保存場所へ移します。
    </p>

    <p id="status">
      データを確認しています...
    </p>

  </div>

  <button id="migrationButton" disabled>
    以前のデータを引き継ぐ
  </button>

  <button id="skipButton">
    新しく始める
  </button>

  <script>

    // 移行対象のlocalStorageキー
    const STORAGE_KEYS = [
      "english-study-app-v1",
      "weakQuestions",
      "stars",
      "records",
      "todayRecord",
      "soundVolume"
    ];


    const status =
      document.getElementById("status");

    const migrationButton =
      document.getElementById("migrationButton");

    const skipButton =
      document.getElementById("skipButton");


    // Chrome側にデータがあるか確認する
    function checkData() {

      let foundCount = 0;

      STORAGE_KEYS.forEach(function(key) {

        const data =
          localStorage.getItem(key);

        if (data !== null) {
          foundCount++;
        }

      });


      if (foundCount > 0) {

        status.textContent =
          "以前のデータが見つかりました。";

        migrationButton.disabled = false;

      } else {

        status.textContent =
          "以前のデータは見つかりませんでした。";

        migrationButton.disabled = true;
      }
    }


    // 以前のデータをAndroidへ送る
    migrationButton.addEventListener(
      "click",
      function() {

        const migrationData = {};


        STORAGE_KEYS.forEach(function(key) {

          const data =
            localStorage.getItem(key);

          if (data !== null) {
            migrationData[key] = data;
          }

        });


        const jsonData =
          JSON.stringify(migrationData);

        const encodedData =
          encodeURIComponent(jsonData);


        const migrationUrl =
          "yontakun://migration?data=" +
          encodedData;


        window.location.href =
          migrationUrl;
      }
    );


    // 新しく始める
    skipButton.addEventListener(
      "click",
      function() {

        window.location.href =
          "yontakun://migration?skip=true";

      }
    );


    // ページを開いたときに確認
    checkData();

  </script>

</body>
</html>
